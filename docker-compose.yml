services:
  mongodb:
    container_name: url_short_mongo
    env_file:
      - .env.example
    image: mongo
    ports:
      - '27017:27017'
    volumes:
      - mongodb:/data/db
      - ./mongodb/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
  url_short:
    container_name: url_short
    depends_on:
      - mongodb
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.example
    volumes:
      - gems:/usr/local/bundle
      - .:/url_short

volumes:
  gems:
  mongodb:
