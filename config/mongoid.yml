development:
  clients:
    default: &default
      database: url_short_development
      hosts:
        - db:27017
      options:
        user: <%= ENV['MONGODB_USER'] %>
        password: <%= ENV['MONGODB_PASSWORD'] %>
        heartbeat_frequency: 10
  options: &options
    raise_not_found_error: true

test:
  clients:
    default:
      <<: *default
      database: url_short_test
  options:
    <<: *options
